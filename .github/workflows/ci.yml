name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build (linux/amd64 + linux/arm64)
        run: |
          make build
          make build-arm64
          ./dist/kumiho-linux-amd64 version

      - name: Cross-compile (windows/amd64 + android/arm64)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

      - name: Doctor smoke test (informational)
        run: |
          ./dist/kumiho-linux-amd64 doctor --json > doctor.json || true
          jq -e '.checks | length > 0' doctor.json > /dev/null
          jq -r '.checks[] | "\(.status)\t\(.name)\t\(.detail)"' doctor.json

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (windows/amd64)
        run: |
          go build -o dist/kumiho-windows-amd64.exe ./cmd/kumiho
          go build -ldflags "-H=windowsgui" -o dist/kumiho-gui-windows-amd64.exe ./cmd/kumiho-gui

      - name: Version smoke test
        run: ./dist/kumiho-windows-amd64.exe version

      - name: GUI version smoke test
        run: |
          $p = Start-Process -FilePath '.\dist\kumiho-gui-windows-amd64.exe' `
            -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput gui-version.txt
          Get-Content gui-version.txt
          if ($p.ExitCode -ne 0) { Write-Error "kumiho-gui --version exited $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Quiet -Path gui-version.txt -Pattern '^kumiho-gui \S+')) {
            Write-Error 'unexpected kumiho-gui --version output'
            exit 1
          }

      - name: Parse install.ps1
        run: pwsh -NoProfile -Command '$t=$null; $e=$null; $null = [System.Management.Automation.Language.Parser]::ParseFile(''install.ps1'',[ref]$t,[ref]$e); if ($e) { $e | ForEach-Object { Write-Host $_ }; exit 1 }'

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Android toolchain
        run: bash scripts/android-setup.sh --ci

      - name: Build emulator AAR
        run: |
          source scripts/android-env.sh
          bash scripts/android-build-aar.sh --emulator

      - name: JVM tests, lint and debug APK
        run: |
          source scripts/android-env.sh
          cd android
          ./gradlew --no-daemon -PkumihoEmulator=true \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Connected tests (API 36)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            source scripts/android-env.sh
            cd android
            ./gradlew --no-daemon -PkumihoEmulator=true :app:connectedDebugAndroidTest

      - name: Release build check (unsigned)
        run: |
          source scripts/android-env.sh
          bash scripts/android-build-aar.sh
          cd android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APKs
        run: |
          source scripts/android-env.sh
          for apk in android/app/build/outputs/apk/release/app-*-release-unsigned.apk; do
            KUMIHO_ALLOW_UNSIGNED=1 bash scripts/android-verify-apk.sh "$apk"
          done
