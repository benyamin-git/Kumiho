name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The Android release script accepts stable MAJOR.MINOR.PATCH tags only.
    # Hyphenated tags (for example v0.5.0-rc.1) are not published. The tag
    # builds a draft release with the signed APKs so the Android phone and TV
    # builds can be tested first; publishing the draft makes it the latest
    # release and keeps the /releases/latest links resolving.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/benyamin-git/kumiho/internal/version.Version=${GITHUB_REF_NAME} -X github.com/benyamin-git/kumiho/internal/version.Commit=${GITHUB_SHA:0:7} -X github.com/benyamin-git/kumiho/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-linux-amd64 ./cmd/kumiho
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-linux-arm64 ./cmd/kumiho
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-windows-amd64.exe ./cmd/kumiho
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/kumiho-gui-windows-amd64.exe ./cmd/kumiho-gui

      - name: Set up Android toolchain
        run: bash scripts/android-setup.sh --ci

      - name: Build signed Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source scripts/android-env.sh
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "release: repository secret $name is missing or empty" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/kumiho-android-release.jks"
          trap 'rm -f "$keystore" android/keystore.properties' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties
          KUMIHO_VERSION="${GITHUB_REF_NAME#v}" \
            KUMIHO_EXPECT_CERT_SHA256="$ANDROID_CERT_SHA256" \
            bash scripts/android-release.sh

      - name: Package zips and checksums
        run: |
          package_linux() {
            arch="$1"
            staging="$(mktemp -d)"
            mkdir -p "$staging/dist" "$staging/systemd"
            cp "dist/kumiho-linux-${arch}" "$staging/dist/kumiho-linux-${arch}"
            cp install.sh LICENSE NOTICE "$staging/"
            cp systemd/kumiho.service systemd/50-kumiho-resolved.rules "$staging/systemd/"
            (cd "$staging" && zip "$GITHUB_WORKSPACE/kumiho-${GITHUB_REF_NAME}-linux-${arch}.zip" "dist/kumiho-linux-${arch}" install.sh LICENSE NOTICE systemd/kumiho.service systemd/50-kumiho-resolved.rules)
          }
          package_linux amd64
          package_linux arm64

          staging="$(mktemp -d)"
          mkdir -p "$staging/third_party/wintun" "$staging/third_party/webview2-loader"
          cp dist/kumiho-windows-amd64.exe "$staging/kumiho.exe"
          cp dist/kumiho-gui-windows-amd64.exe "$staging/kumiho-gui.exe"
          cp third_party/wintun/amd64/wintun.dll "$staging/wintun.dll"
          cp install.ps1 install.cmd LICENSE NOTICE "$staging/"
          cp third_party/wintun/LICENSE.txt "$staging/third_party/wintun/LICENSE.txt"
          cp third_party/webview2-loader/LICENSE.txt "$staging/third_party/webview2-loader/LICENSE.txt"
          (cd "$staging" && zip "$GITHUB_WORKSPACE/kumiho-${GITHUB_REF_NAME}-windows-amd64.zip" kumiho.exe kumiho-gui.exe wintun.dll install.ps1 install.cmd LICENSE NOTICE third_party/wintun/LICENSE.txt third_party/webview2-loader/LICENSE.txt)

      - name: Stage versioned and stable release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "kumiho-${GITHUB_REF_NAME}-linux-amd64.zip" "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-amd64.zip"
          cp "kumiho-${GITHUB_REF_NAME}-linux-arm64.zip" "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-arm64.zip"
          cp "kumiho-${GITHUB_REF_NAME}-windows-amd64.zip" "release-assets/Kumiho-${GITHUB_REF_NAME}-Windows-amd64.zip"
          cp "dist/kumiho-${GITHUB_REF_NAME}-android-arm64-v8a.apk" "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-arm64-v8a.apk"
          cp "dist/kumiho-${GITHUB_REF_NAME}-android-armeabi-v7a.apk" "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-armeabi-v7a.apk"
          cp "dist/kumiho-${GITHUB_REF_NAME}-android-universal.apk" "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-universal.apk"

          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-amd64.zip" release-assets/Kumiho-Linux-amd64.zip
          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-arm64.zip" release-assets/Kumiho-Linux-arm64.zip
          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Windows-amd64.zip" release-assets/Kumiho-Windows-amd64.zip
          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-arm64-v8a.apk" release-assets/Kumiho-Android-arm64-v8a.apk
          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-armeabi-v7a.apk" release-assets/Kumiho-Android-armeabi-v7a.apk
          cp "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-universal.apk" release-assets/Kumiho-Android-universal.apk

          (
            cd release-assets
            sha256sum \
              "Kumiho-${GITHUB_REF_NAME}-Linux-amd64.zip" \
              "Kumiho-${GITHUB_REF_NAME}-Linux-arm64.zip" \
              "Kumiho-${GITHUB_REF_NAME}-Windows-amd64.zip" \
              "Kumiho-${GITHUB_REF_NAME}-Android-arm64-v8a.apk" \
              "Kumiho-${GITHUB_REF_NAME}-Android-armeabi-v7a.apk" \
              "Kumiho-${GITHUB_REF_NAME}-Android-universal.apk" \
              Kumiho-Linux-amd64.zip \
              Kumiho-Linux-arm64.zip \
              Kumiho-Windows-amd64.zip \
              Kumiho-Android-arm64-v8a.apk \
              Kumiho-Android-armeabi-v7a.apk \
              Kumiho-Android-universal.apk > SHA256SUMS
          )
          cp release-assets/SHA256SUMS "release-assets/SHA256SUMS-${GITHUB_REF_NAME}"
          cmp release-assets/SHA256SUMS "release-assets/SHA256SUMS-${GITHUB_REF_NAME}"
          for name in \
            "Kumiho-${GITHUB_REF_NAME}-Linux-amd64.zip" \
            "Kumiho-${GITHUB_REF_NAME}-Linux-arm64.zip" \
            "Kumiho-${GITHUB_REF_NAME}-Windows-amd64.zip" \
            "Kumiho-${GITHUB_REF_NAME}-Android-arm64-v8a.apk" \
            "Kumiho-${GITHUB_REF_NAME}-Android-armeabi-v7a.apk" \
            "Kumiho-${GITHUB_REF_NAME}-Android-universal.apk" \
            Kumiho-Linux-amd64.zip \
            Kumiho-Linux-arm64.zip \
            Kumiho-Windows-amd64.zip \
            Kumiho-Android-arm64-v8a.apk \
            Kumiho-Android-armeabi-v7a.apk \
            Kumiho-Android-universal.apk \
            SHA256SUMS \
            "SHA256SUMS-${GITHUB_REF_NAME}"; do
            test -s "release-assets/$name" || { echo "missing release asset: $name" >&2; exit 1; }
          done
          cat release-assets/SHA256SUMS

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes="$RUNNER_TEMP/kumiho-release-notes.md"
          awk -v version="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" version "]") == 1) found = 1
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog-section.md"
          {
            printf '## Download\n\n'
            printf '| Platform | Download |\n| --- | --- |\n'
            printf '| Windows 11 (64-bit) | [![Windows x64 ZIP](https://img.shields.io/badge/ZIP-x64-0550ae?logo=windows&logoColor=white)](%s/Kumiho-%s-Windows-amd64.zip) |\n' "$download" "$GITHUB_REF_NAME"
            printf '| Linux (64-bit / ARM64) | [![Linux x64 ZIP](https://img.shields.io/badge/ZIP-x64-e36209?logo=linux&logoColor=white)](%s/Kumiho-%s-Linux-amd64.zip) [![Linux ARM64 ZIP](https://img.shields.io/badge/ZIP-ARM64-f0883e?logo=linux&logoColor=white)](%s/Kumiho-%s-Linux-arm64.zip) |\n' "$download" "$GITHUB_REF_NAME" "$download" "$GITHUB_REF_NAME"
            printf '| Android phone and TV | [![Android ARMv8 APK](https://img.shields.io/badge/APK-ARMv8-2da44e?logo=android&logoColor=white)](%s/Kumiho-%s-Android-arm64-v8a.apk) [![Android ARMv7 APK](https://img.shields.io/badge/APK-ARMv7-4ac26b?logo=android&logoColor=white)](%s/Kumiho-%s-Android-armeabi-v7a.apk) [![Android universal APK](https://img.shields.io/badge/APK-Universal-1a7f37?logo=android&logoColor=white)](%s/Kumiho-%s-Android-universal.apk) |\n' "$download" "$GITHUB_REF_NAME" "$download" "$GITHUB_REF_NAME" "$download" "$GITHUB_REF_NAME"
            printf '\nVerify every download against [SHA256SUMS-%s](%s/SHA256SUMS-%s).\n' "$GITHUB_REF_NAME" "$download" "$GITHUB_REF_NAME"
            printf 'The stable aliases (`Kumiho-Windows-amd64.zip`, `Kumiho-Linux-amd64.zip`, `Kumiho-Linux-arm64.zip`, `Kumiho-Android-*.apk`) and `SHA256SUMS` are attached for `/releases/latest`.\n'
            printf '\n[Persian overview](https://github.com/%s/blob/%s/README.fa.md)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            if [ -s "$RUNNER_TEMP/changelog-section.md" ]; then
              cat "$RUNNER_TEMP/changelog-section.md"
            else
              printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            fi
          } > "$notes"
          cat "$notes"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Kumiho $GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --notes-file "$RUNNER_TEMP/kumiho-release-notes.md" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-amd64.zip" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Linux-arm64.zip" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Windows-amd64.zip" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-arm64-v8a.apk" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-armeabi-v7a.apk" \
            "release-assets/Kumiho-${GITHUB_REF_NAME}-Android-universal.apk" \
            release-assets/Kumiho-Linux-amd64.zip \
            release-assets/Kumiho-Linux-arm64.zip \
            release-assets/Kumiho-Windows-amd64.zip \
            release-assets/Kumiho-Android-arm64-v8a.apk \
            release-assets/Kumiho-Android-armeabi-v7a.apk \
            release-assets/Kumiho-Android-universal.apk \
            release-assets/SHA256SUMS \
            "release-assets/SHA256SUMS-${GITHUB_REF_NAME}"

      - name: Remove Android signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kumiho-android-release.jks" android/keystore.properties
