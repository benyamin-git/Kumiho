name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The Android release script accepts stable MAJOR.MINOR.PATCH tags only.
    # Hyphenated tags (for example v0.5.0-rc.1) are not published. While the
    # project is on the v0.x series, stable tags are published as GitHub
    # prereleases.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/benyamin-git/kumiho/internal/version.Version=${GITHUB_REF_NAME} -X github.com/benyamin-git/kumiho/internal/version.Commit=${GITHUB_SHA:0:7} -X github.com/benyamin-git/kumiho/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-linux-amd64 ./cmd/kumiho
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-linux-arm64 ./cmd/kumiho
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/kumiho-windows-amd64.exe ./cmd/kumiho
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/kumiho-gui-windows-amd64.exe ./cmd/kumiho-gui

      - name: Set up Android toolchain
        run: bash scripts/android-setup.sh --ci

      - name: Build signed Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source scripts/android-env.sh
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "release: repository secret $name is missing or empty" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/kumiho-android-release.jks"
          trap 'rm -f "$keystore" android/keystore.properties' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties
          KUMIHO_VERSION="${GITHUB_REF_NAME#v}" \
            KUMIHO_EXPECT_CERT_SHA256="$ANDROID_CERT_SHA256" \
            bash scripts/android-release.sh

      - name: Package zips and checksums
        run: |
          package_linux() {
            arch="$1"
            staging="$(mktemp -d)"
            mkdir -p "$staging/dist" "$staging/systemd"
            cp "dist/kumiho-linux-${arch}" "$staging/dist/kumiho-linux-${arch}"
            cp install.sh LICENSE NOTICE "$staging/"
            cp systemd/kumiho.service systemd/50-kumiho-resolved.rules "$staging/systemd/"
            (cd "$staging" && zip "$GITHUB_WORKSPACE/kumiho-${GITHUB_REF_NAME}-linux-${arch}.zip" "dist/kumiho-linux-${arch}" install.sh LICENSE NOTICE systemd/kumiho.service systemd/50-kumiho-resolved.rules)
          }
          package_linux amd64
          package_linux arm64

          staging="$(mktemp -d)"
          mkdir -p "$staging/third_party/wintun" "$staging/third_party/webview2-loader"
          cp dist/kumiho-windows-amd64.exe "$staging/kumiho.exe"
          cp dist/kumiho-gui-windows-amd64.exe "$staging/kumiho-gui.exe"
          cp third_party/wintun/amd64/wintun.dll "$staging/wintun.dll"
          cp install.ps1 install.cmd LICENSE NOTICE "$staging/"
          cp third_party/wintun/LICENSE.txt "$staging/third_party/wintun/LICENSE.txt"
          cp third_party/webview2-loader/LICENSE.txt "$staging/third_party/webview2-loader/LICENSE.txt"
          (cd "$staging" && zip "$GITHUB_WORKSPACE/kumiho-${GITHUB_REF_NAME}-windows-amd64.zip" kumiho.exe kumiho-gui.exe wintun.dll install.ps1 install.cmd LICENSE NOTICE third_party/wintun/LICENSE.txt third_party/webview2-loader/LICENSE.txt)

          sha256sum "kumiho-${GITHUB_REF_NAME}-linux-amd64.zip" "kumiho-${GITHUB_REF_NAME}-linux-arm64.zip" "kumiho-${GITHUB_REF_NAME}-windows-amd64.zip" > SHA256SUMS
          (cd dist && sha256sum kumiho-${GITHUB_REF_NAME}-android-*.apk) >> SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Kumiho $GITHUB_REF_NAME" \
            "${release_args[@]}" \
            --generate-notes \
            "kumiho-${GITHUB_REF_NAME}-linux-amd64.zip" \
            "kumiho-${GITHUB_REF_NAME}-linux-arm64.zip" \
            "kumiho-${GITHUB_REF_NAME}-windows-amd64.zip" \
            "dist/kumiho-${GITHUB_REF_NAME}-android-arm64-v8a.apk" \
            "dist/kumiho-${GITHUB_REF_NAME}-android-armeabi-v7a.apk" \
            "dist/kumiho-${GITHUB_REF_NAME}-android-universal.apk" \
            SHA256SUMS

      - name: Remove Android signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kumiho-android-release.jks" android/keystore.properties
